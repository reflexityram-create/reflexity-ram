name: Canada Post tracking sync

# Asks the site to check tracked paid orders with Canada Post: mark shipped on the first scan, mark delivered, email buyers
# (backend/src/utils/trackingSync.js). The cron below says every 15 minutes, but GitHub only runs it about four times a day (measured:
# 33 runs in 8 days), so the server also runs the same job itself every 15 minutes while it is awake (server.js). This schedule stays
# because it wakes a sleeping Render free instance and is the only trigger when nothing keeps the server awake.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the site to check shipped parcels
        env:
          TOKEN: ${{ secrets.TRACKING_SYNC_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://reflexity-ram.onrender.com/api/tracking/sync
