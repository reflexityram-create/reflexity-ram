name: Canada Post tracking sync

# Every 3 hours the site checks shipped parcels with Canada Post, marks
# delivered orders and emails buyers (backend/src/utils/trackingSync.js).
# Scheduled here because the Render free plan sleeps between requests.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask the site to check shipped parcels
        env:
          TOKEN: ${{ secrets.TRACKING_SYNC_TOKEN }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 180 -X POST \
            -H "Authorization: Bearer $TOKEN" \
            https://reflexity-ram.onrender.com/api/tracking/sync
