name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm run install:all

      - name: Run test, build, and secret-scan checks
        run: npm run verify

      - name: Audit dependencies
        run: |
          npm audit --audit-level=high
          npm --prefix frontend audit --audit-level=high
          npm --prefix backend audit --audit-level=high

      - name: Validate production deployment configuration
        run: |
          node --test backend/test/release-hardening.test.js
          git diff --check

  deployment-config:
    name: Deployment configuration gate
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify provider-safe smoke configuration
        run: |
          test -f backend/render.yaml
          test -f frontend/public/_headers
          grep -Fq 'rootDir: backend' backend/render.yaml
          grep -Fq 'healthCheckPath: /api/health' backend/render.yaml
          grep -Fq "script-src-attr 'none'" frontend/public/_headers
          ! grep -Eq 'key:[[:space:]]*SEED_SECRET' backend/render.yaml
