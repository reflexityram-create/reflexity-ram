services:
  - type: web
    name: reflexity-ram-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: node src/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CURRENCY
        value: cad
      # Server-side GA4 purchase reporting (Measurement Protocol). Without the
      # secret the browser reports purchases instead. Create the secret in GA4:
      # Admin > Data streams > the web stream > Measurement Protocol API secrets.
      - key: GA4_MEASUREMENT_ID
        value: G-LHK5KZSYG6
      - key: GA4_API_SECRET
        sync: false
      # Canada Post developer API (tracking + rating) and the token the
      # scheduled tracking sync sends (.github/workflows/tracking-sync.yml).
      - key: CANADA_POST_API_KEY
        sync: false
      - key: CANADA_POST_API_SECRET
        sync: false
      - key: TRACKING_SYNC_TOKEN
        sync: false
      # Optional: the account's customer number (discounted Canada Post prices
      # for buyers abroad) and the postal code parcels are mailed from.
      - key: CANADA_POST_CUSTOMER_NUMBER
        sync: false
      - key: CANADA_POST_ORIGIN_POSTAL_CODE
        sync: false
      # Zonos API credential: quotes the US import duties and fees a US buyer prepays at checkout. Without it the
      # United States is simply not offered (utils/zonos.js).
      - key: ZONOS_API_KEY
        sync: false
      # Other ways to pay (utils/paymentMethods.js, docs/payments.md). All OFF unless set to "true". Bank debit needs Stripe's
      # pre-authorized debit capability (active on the account). Interac e-Transfer also needs ETRANSFER_RECIPIENT_EMAIL: the
      # address that receives the transfers (auto-deposit on); without it e-Transfer is never offered.
      - key: BANK_DEBIT_ENABLED
        sync: false
      - key: BANK_DEBIT_DISCOUNT_PCT
        sync: false
      - key: ETRANSFER_ENABLED
        sync: false
      - key: ETRANSFER_RECIPIENT_EMAIL
        sync: false
      - key: ETRANSFER_DISCOUNT_PCT
        sync: false
      - key: ETRANSFER_HOLD_HOURS
        sync: false
      - key: ETRANSFER_REMINDER_HOURS
        sync: false
      - key: ETRANSFER_MAX_UNITS
        sync: false
      - key: ETRANSFER_MAX_TOTAL_CAD
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false
