<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0c0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#7a7aff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#a8a8b0"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1a1a1f" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.5"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- monogram badge -->
  <g transform="translate(80, 80)">
    <rect width="56" height="56" rx="12" fill="#0e0e12" stroke="#26262c" stroke-width="1"/>
    <path d="M17 42V14h12c5 0 8.6 3.2 8.6 8 0 3.6-2 6.2-5.4 7.4L38 42h-6.1l-5.8-9.1h-4.1V42H17zm5.5-14h5.8c2.5 0 4-1.3 4-3.5s-1.5-3.5-4-3.5h-5.8V28z" fill="#f5f5f7"/>
  </g>
  <text x="156" y="118" font-family="Figtree, sans-serif" font-size="22" font-weight="600" fill="#f5f5f7" letter-spacing="0.04em">REFLEXITY RAM</text>

  <!-- main title -->
  <text x="80" y="370" font-family="Figtree, sans-serif" font-size="140" font-weight="800" fill="url(#title)" letter-spacing="-0.04em">Reflexity RAM.</text>

  <!-- subtitle -->
  <text x="82" y="430" font-family="JetBrains Mono, monospace" font-size="22" fill="#9a9aa3" letter-spacing="0.06em">DDR4  ·  DDR5  ·  SERVER  ·  LAPTOP MEMORY</text>

  <!-- divider -->
  <rect x="80" y="478" width="80" height="1" fill="#3a3a42"/>

  <!-- bottom row -->
  <text x="80" y="530" font-family="Figtree, sans-serif" font-size="22" fill="#cfcfd6">Memory, made accessible.</text>
  <text x="80" y="562" font-family="JetBrains Mono, monospace" font-size="14" fill="#6e6e76" letter-spacing="0.08em">WHOLESALE  ·  RETAIL  ·  DIRECT</text>

  <!-- accent dot -->
  <circle cx="1060" cy="310" r="120" fill="#ffffff" opacity="0.03"/>
  <circle cx="1060" cy="310" r="60" fill="#ffffff" opacity="0.05"/>
</svg>
